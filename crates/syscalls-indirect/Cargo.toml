[package]
name = "syscalls-indirect"
version = "0.1.0"
edition = "2021"

[lib]
name = "syscalls_indirect"
path = "src/lib.rs"

[[example]]
name = "demo_indirect_syscall"
path = "examples/demo_indirect_syscall.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }
