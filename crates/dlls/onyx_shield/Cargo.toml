[package]
name = "onyx_shield"
version = "0.1.0"
edition = "2021"

[lib]
name = "onyx_shield"
crate-type = ["cdylib", "rlib"]

[dependencies]
onyx_core = { path = "../../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
