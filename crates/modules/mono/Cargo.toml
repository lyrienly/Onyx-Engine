[package]
name = "onyx_mono"
version = "0.1.0"
edition = "2021"

[lib]
name = "onyx_mono"
crate-type = ["rlib"]

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[lints]
workspace = true
