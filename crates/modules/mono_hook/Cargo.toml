[package]
name = "onyx_mono_hook"
version = "0.1.0"
edition = "2021"

[lib]
name = "onyx_mono_hook"
crate-type = ["rlib"]

[dependencies]
onyx_hook = { path = "../hook" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
