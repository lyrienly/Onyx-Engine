[package]
name = "onyx_hook"
version = "0.1.0"
edition = "2021"

[lib]
name = "onyx_hook"
crate-type = ["cdylib", "rlib"]

[dependencies]
zydis = "4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
