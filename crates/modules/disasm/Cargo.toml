[package]
name = "onyx_disasm"
version = "0.1.0"
edition = "2021"

[lib]
name = "onyx_disasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
onyx_core = { path = "../../core" }
zydis = "4.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
